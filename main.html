<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Footer</title>

    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        footer {
            background-color: #000;
            color: white;
        }

        .footer-container {
            padding: 38px 4.3% 58px;
        }

        /* Top section */
        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 72px;
        }

        .company {
            font-size: 32px;
            font-weight: 300;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .media-icons {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
        }

        .facebook {
            background-color: #4267b2;
        }

        .twitter {
            background-color: #1da1f2;
        }

        .instagram {
            background-color: #e1306c;
        }

        .linkedin {
            background-color: #0077b5;
        }

        .youtube {
            background-color: #ff0000;
        }

        /* Footer links */
        .footer-content {
            display: flex;
            justify-content: space-between;
        }

        .footer-column {
            width: 22%;
        }

        .footer-column h3 {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 5px;
        }

        .footer-column h3::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 44px;
            height: 2px;
            background-color: white;
        }

        .footer-column a {
            display: block;
            color: #c8c8c8;
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .footer-column a:hover {
            color: white;
        }

        .footer-column p {
            color: #c8c8c8;
            font-size: 18px;
            margin-bottom: 16px;
        }

        /* Bottom section */
        .footer-bottom {
            background-color: #2f3440;
            min-height: 69px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4.3%;
            color: #c8c8c8;
            font-size: 17px;
        }

        .footer-bottom a {
            color: #c8c8c8;
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .footer-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 30px;
                margin-bottom: 45px;
            }

            .social-icons {
                flex-wrap: wrap;
            }

            .footer-content {
                flex-wrap: wrap;
                gap: 35px;
            }

            .footer-column {
                width: 45%;
            }
        }

        @media (max-width: 480px) {
            .footer-container {
                padding: 30px 25px 40px;
            }

            .footer-content {
                flex-direction: column;
                gap: 25px;
            }

            .footer-column {
                width: 100%;
            }

            .company {
                font-size: 30px;
            }

            .social-icons {
                gap: 10px;
            }

            .media-icons {
                width: 45px;
                height: 45px;
            }

            .footer-bottom {
                padding: 15px 25px;
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <footer>

        <div class="footer-container">

            <!-- Company and Social Media -->
            <div class="footer-top">

                <div class="company">
                    company
                </div>

                <div class="social-icons">

                    <a href="#" class="media-icons facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" class="media-icons twitter">
                        <i class="fa-brands fa-twitter"></i>
                    </a>

                    <a href="#" class="media-icons instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" class="media-icons linkedin">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <a href="#" class="media-icons youtube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>

                </div>
            </div>

            <!-- Footer Content -->
            <div class="footer-content">

                <!-- Home -->
                <div class="footer-column">
                    <h3>Home</h3>

                    <a href="#">Home</a>
                    <a href="#">Welcome</a>
                    <a href="#">Get Started</a>
                </div>

                <!-- About -->
                <div class="footer-column">
                    <h3>About</h3>

                    <a href="#">About Us</a>
                    <a href="#">Our Team</a>
                    <a href="#">Our Work</a>
                </div>

                <!-- Links -->
                <div class="footer-column">
                    <h3>Links</h3>

                    <a href="#">Home</a>
                    <a href="#">Contact</a>
                    <a href="#">About Us</a>
                    <a href="#">Get Started</a>
                </div>

                <!-- Services -->
                <div class="footer-column">
                    <h3>Services</h3>

                    <a href="#">App Design</a>
                    <a href="#">Web Design</a>
                    <a href="#">Logo Design</a>
                    <a href="#">Banner Design</a>
                </div>

                <!-- Contact -->
                <div class="footer-column">
                    <h3>Contact</h3>

                    <p>+91 8879887262</p>
                    <p>+91 8879887262</p>
                    <p>contact@company.com</p>
                </div>

            </div>

        </div>

        <!-- Bottom -->
        <div class="footer-bottom">

            <span>Copyright © 2021 company.</span>

            <a href="#">Privacy policy</a>

        </div>

    </footer>

</body>

</html>
